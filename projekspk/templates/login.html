<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Capital Analytics</title>
 
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
 
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
        :root {
            --ink: #0a0a0f;
            --ink-mid: #1a1a2e;
            --ink-soft: #2d2d4e;
            --accent: #6c63ff;
            --accent-glow: rgba(108, 99, 255, 0.35);
            --gold: #f5c842;
            --surface: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.08);
            --text: #e8e8f0;
            --text-muted: #7c7c9a;
        }
 
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
 
        /* Animated background */
        .bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
        }
 
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            animation: drift 12s ease-in-out infinite alternate;
        }
 
        .orb-1 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #6c63ff, #3b1fa0);
            top: -10%; left: -10%;
            animation-delay: 0s;
        }
 
        .orb-2 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #ff6584, #c026d3);
            bottom: -10%; right: -10%;
            animation-delay: -4s;
        }
 
        .orb-3 {
            width: 300px; height: 300px;
            background: radial-gradient(circle, #38bdf8, #0e7490);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -8s;
        }
 
        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -30px) scale(1.08); }
        }
 
        /* Grid lines */
        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 60px 60px;
        }
 
        /* Login card */
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }
 
        .login-card {
            background: rgba(15, 15, 30, 0.85);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 44px;
            box-shadow:
                0 0 0 1px rgba(108,99,255,0.1),
                0 40px 80px rgba(0,0,0,0.6),
                inset 0 1px 0 rgba(255,255,255,0.06);
            animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
 
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
 
        /* Logo area */
        .logo-ring {
            width: 56px; height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, #6c63ff, #a855f7);
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 28px;
            box-shadow: 0 0 30px var(--accent-glow);
        }
 
        .logo-ring i { font-size: 1.4rem; color: white; }
 
        .login-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.85rem;
            font-weight: 800;
            color: var(--text);
            line-height: 1.1;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }
 
        .login-subtitle {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 36px;
            font-weight: 300;
        }
 
        /* Form fields */
        .field-group {
            margin-bottom: 18px;
        }
 
        .field-label {
            display: block;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 8px;
        }
 
        .field-wrap {
            position: relative;
        }
 
        .field-icon {
            position: absolute;
            left: 16px; top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.85rem;
            transition: color 0.2s;
        }
 
        .field-input {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 13px 16px 13px 42px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
 
        .field-input::placeholder { color: var(--text-muted); }
 
        .field-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
 
        .field-input:focus + .field-icon,
        .field-wrap:focus-within .field-icon {
            color: var(--accent);
        }
 
        /* Password toggle */
        .toggle-pw {
            position: absolute;
            right: 14px; top: 50%;
            transform: translateY(-50%);
            background: none; border: none; cursor: pointer;
            color: var(--text-muted);
            font-size: 0.85rem;
            transition: color 0.2s;
            padding: 4px;
        }
        .toggle-pw:hover { color: var(--text); }
 
        /* Error */
        .error-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 10px;
            padding: 12px 16px;
            color: #fca5a5;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
 
        /* Submit button */
        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #6c63ff 0%, #a855f7 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-family: 'Syne', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            cursor: pointer;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
            transition: opacity 0.2s, transform 0.2s;
            box-shadow: 0 8px 24px var(--accent-glow);
        }
 
        .btn-login::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
            opacity: 0;
            transition: opacity 0.2s;
        }
 
        .btn-login:hover { opacity: 0.92; transform: translateY(-1px); }
        .btn-login:hover::before { opacity: 1; }
        .btn-login:active { transform: translateY(0); }
 
        /* Demo accounts */
        .demo-section {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }
 
        .demo-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 12px;
        }
 
        .demo-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
 
        .demo-chip {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 7px 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
 
        .demo-chip:hover {
            border-color: rgba(108,99,255,0.5);
            background: rgba(108,99,255,0.08);
        }
 
        .chip-role {
            font-size: 0.68rem;
            color: var(--accent);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
 
        .chip-cred {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 1px;
        }
    </style>
</head>
<body>
 
<div class="bg-canvas">
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>
</div>
<div class="grid-overlay"></div>
 
<div class="login-wrapper">
    <div class="login-card">
 
        <div class="logo-ring">
            <i class="fa-solid fa-chart-bar"></i>
        </div>
 
        <h1 class="login-title">Capital<br>Analytics</h1>
        <p class="login-subtitle">Masuk ke sistem Decision Support AHP & SAW</p>
 
        {% if error %}
        <div class="error-box">
            <i class="fa-solid fa-circle-exclamation"></i>
            {{ error }}
        </div>
        {% endif %}
 
        <form method="POST" action="/login">
            <div class="field-group">
                <label class="field-label" for="username">Username</label>
                <div class="field-wrap">
                    <i class="fa-solid fa-user field-icon"></i>
                    <input
                        class="field-input"
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Masukkan username..."
                        autocomplete="username"
                        required
                    >
                </div>
            </div>
 
            <div class="field-group">
                <label class="field-label" for="password">Password</label>
                <div class="field-wrap">
                    <i class="fa-solid fa-lock field-icon"></i>
                    <input
                        class="field-input"
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Masukkan password..."
                        autocomplete="current-password"
                        required
                    >
                    <button type="button" class="toggle-pw" onclick="togglePassword()">
                        <i class="fa-solid fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>
 
            <button type="submit" class="btn-login">
                Masuk ke Dashboard &nbsp;<i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
 
        <div class="demo-section">
            <p class="demo-label">Akun Demo Tersedia</p>
            <div class="demo-chips">
                <div class="demo-chip" onclick="fillDemo('admin','admin123')">
                    <div class="chip-role">Admin</div>
                    <div class="chip-cred">admin / admin123</div>
                </div>
                <div class="demo-chip" onclick="fillDemo('hr_manager','hr2024')">
                    <div class="chip-role">HR Manager</div>
                    <div class="chip-cred">hr_manager / hr2024</div>
                </div>
                <div class="demo-chip" onclick="fillDemo('analyst','analyst123')">
                    <div class="chip-role">Analyst</div>
                    <div class="chip-cred">analyst / analyst123</div>
                </div>
            </div>
        </div>
 
    </div>
</div>
 
<script>
    function togglePassword() {
        const pw = document.getElementById('password');
        const icon = document.getElementById('eyeIcon');
        if (pw.type === 'password') {
            pw.type = 'text';
            icon.className = 'fa-solid fa-eye-slash';
        } else {
            pw.type = 'password';
            icon.className = 'fa-solid fa-eye';
        }
    }
 
    function fillDemo(user, pass) {
        document.getElementById('username').value = user;
        document.getElementById('password').value = pass;
        document.getElementById('username').focus();
    }
</script>
 
</body>
</html>
